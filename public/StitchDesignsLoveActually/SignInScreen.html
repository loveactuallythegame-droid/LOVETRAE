<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Love Actually</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0a0c 0%, #392830 50%, #0f0a0c 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(252, 199, 56, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(234, 3, 31, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(198, 10, 179, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #db147c, #f05d68);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(219, 20, 124, 0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .glass-card {
            background: rgba(26, 10, 31, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #fcc738, #ea031f, #c60ab3, 
                #ef1b6e, #c41e77, #a22ac4, #9056ef);
            border-radius: 22px;
            z-index: -1;
            background-size: 400% 400%;
            animation: gradientShift 6s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(250, 31, 99, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: rgba(250, 31, 99, 0.8);
            box-shadow: 0 0 15px rgba(250, 31, 99, 0.2);
        }

        .remember-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox.checked {
            background: linear-gradient(45deg, #db147c, #f05d68);
            border-color: #db147c;
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .forgot-password {
            color: #37cf97;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .squishy-button {
            background: linear-gradient(45deg, #db147c, #f05d68);
            border: none;
            border-radius: 15px;
            padding: 20px 30px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(219, 20, 124, 0.4);
            margin-bottom: 15px;
        }

        .squishy-button:hover {
            transform: scale(0.98);
            box-shadow: 0 8px 25px rgba(219, 20, 124, 0.6);
        }

        .squishy-button:active {
            transform: scale(0.95);
        }

        .squishy-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider-container {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider-text {
            padding: 0 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .signup-button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 30px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .signup-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        .footer a {
            color: #37cf97;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .marcie-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(252, 199, 56, 0.3);
        }

        .marcie-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #fcc738, #ea031f, #c60ab3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 3px solid #ffef1f;
            box-shadow: 0 0 20px rgba(252, 199, 56, 0.5);
        }

        .marcie-quote {
            flex: 1;
            font-style: italic;
            color: #ffef1f;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .text-input {
                padding: 15px;
            }
            
            .squishy-button, .signup-button {
                padding: 18px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue your journey</p>
        </div>

        <div class="glass-card">
            <form id="signInForm">
                <div class="input-group">
                    <label class="input-label">EMAIL ADDRESS</label>
                    <input 
                        type="email" 
                        class="text-input" 
                        id="emailInput"
                        placeholder="commander@nebula.space"
                        required
                    >
                </div>

                <div class="input-group">
                    <label class="input-label">PASSWORD</label>
                    <input 
                        type="password" 
                        class="text-input" 
                        id="passwordInput"
                        placeholder="••••••••••••"
                        required
                    >
                </div>

                <div class="remember-container">
                    <div class="checkbox-container">
                        <div class="checkbox" id="rememberCheckbox" onclick="toggleCheckbox()"></div>
                        <span class="checkbox-label">Remember me</span>
                    </div>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()">Forgot Password?</a>
                </div>

                <button type="submit" class="squishy-button" id="signInButton" disabled>
                    Sign In
                </button>

                <div class="divider-container">
                    <div class="divider-line"></div>
                    <div class="divider-text">OR</div>
                    <div class="divider-line"></div>
                </div>

                <button type="button" class="signup-button" onclick="showSignUp()">
                    Create Account
                </button>
            </form>
        </div>

        <div class="footer">
            <a href="#">Legal Disclaimer</a>
            <span>© 2026 Love Actually</span>
            <a href="#">Help & FAQ</a>
        </div>

        <div class="marcie-section">
            <div class="marcie-avatar">👩‍⚕️</div>
            <div class="marcie-quote">
                "Back so soon? I like your dedication to the process. 
                Relationships take work, but it's the good kind of work."
            </div>
        </div>
    </div>

    <script>
        let isRememberChecked = false;
        
        // Update button state based on form validity
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const signInButton = document.getElementById('signInButton');
        
        function updateButtonState() {
            signInButton.disabled = !(emailInput.value && passwordInput.value);
        }
        
        emailInput.addEventListener('input', updateButtonState);
        passwordInput.addEventListener('input', updateButtonState);
        
        // Toggle remember me checkbox
        function toggleCheckbox() {
            const checkbox = document.getElementById('rememberCheckbox');
            isRememberChecked = !isRememberChecked;
            
            if (isRememberChecked) {
                checkbox.classList.add('checked');
            } else {
                checkbox.classList.remove('checked');
            }
        }
        
        // Handle form submission
        document.getElementById('signInForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const email = emailInput.value;
            const password = passwordInput.value;
            
            // In a real app, this would authenticate with a server
            console.log('Signing in with:', { email, password, rememberMe: isRememberChecked });
            
            // Show success message
            alert('Sign in successful! Redirecting to your dashboard...');
            
            // In a real app, redirect to main app
            // window.location.href = 'DashboardHome.html';
        });
        
        function showForgotPassword() {
            alert('Forgot password functionality would open a reset form in the full application.');
        }
        
        function showSignUp() {
            alert('Redirecting to sign up page...');
            // In a real app, redirect to sign up page
            // window.location.href = 'SignUpScreen.html';
        }
    </script>
</body>
</html>
